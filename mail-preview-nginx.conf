server {
    listen 8025;
    # Reject DNS rebinding and cross-origin requests to the local mailbox.
    if ($http_host !~* "^(localhost|127\\.0\\.0\\.1):8025$") { return 403; }
    if ($http_origin !~* "^(|http://(localhost|127\\.0\\.0\\.1):8025)$") { return 403; }
    location / {
        proxy_pass http://mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
