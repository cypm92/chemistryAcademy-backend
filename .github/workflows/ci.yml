name: CI backend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cypm92/beciencia-backend

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Credenciales y bases exclusivamente efímeras para este job; nunca producción.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SMTP_MODE: log
      MICROSOFT_SYNC_ENABLED: 'false'
      ISOLATED_POSTGRES_TEST_URL: postgresql://ci_test:ci_test_password@127.0.0.1:5432/booking_disposable
      TEST_REPORT_DATABASE_URL: postgresql://ci_test:ci_test_password@127.0.0.1:5432/reports_disposable
      OAUTH_ISOLATED_POSTGRES_TEST_URL: postgresql://ci_test:ci_test_password@127.0.0.1:5432/oauth_disposable
      MICROSOFT_SCHEMA_TEST_POSTGRES_URL: postgresql://ci_test:ci_test_password@127.0.0.1:5432/schema_disposable
      TEAMS_TEST_POSTGRES_URL: postgresql://ci_test:ci_test_password@127.0.0.1:5432/teams_disposable
      TEAMS_DELETE_TEST_POSTGRES_URL: postgresql://ci_test:ci_test_password@127.0.0.1:5432/teams_delete_disposable
      MICROSOFT_E2E_POSTGRES_URL: postgresql://ci_test:ci_test_password@127.0.0.1:5432/microsoft_e2e_disposable
      INTEGRATION_TEST_POSTGRES_URL: postgresql://ci_test:ci_test_password@127.0.0.1:5432/integration_disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de pruebas
        run: python -m pip install --requirement requirements-test.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Comprobar sintaxis Python
        run: python -m compileall -q app
      - name: Crear bases PostgreSQL aisladas
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U ci_test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE booking_disposable;
          CREATE DATABASE reports_disposable;
          CREATE DATABASE oauth_disposable;
          CREATE DATABASE schema_disposable;
          CREATE DATABASE teams_disposable;
          CREATE DATABASE teams_delete_disposable;
          CREATE DATABASE microsoft_e2e_disposable;
          CREATE DATABASE integration_disposable;
          SQL
      # El checkout solo contiene backend: la prueba nginx del frontend se omite.
      - name: Ejecutar pruebas pytest y unittest sin red externa
        run: |
          sudo iptables -I OUTPUT 1 ! -d 127.0.0.0/8 -j REJECT
          trap 'sudo iptables -D OUTPUT ! -d 127.0.0.0/8 -j REJECT; sudo ip6tables -D OUTPUT ! -d ::1/128 -j REJECT || true' EXIT
          sudo ip6tables -I OUTPUT 1 ! -d ::1/128 -j REJECT
          python -m pytest tests -v -ra --junitxml="${RUNNER_TEMP}/backend-pytest.xml"
      - name: Impedir omisiones inesperadas de pruebas
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          report = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'backend-pytest.xml'))
          allowed = ('tests.test_callback_access_logging', 'test_nginx_callback_location_disables_access_logging_and_preserves_proxy')
          unexpected = [case.get('classname', '') + '::' + case.get('name', '')
                        for case in report.iter('testcase') if case.find('skipped') is not None
                        and (case.get('classname'), case.get('name')) != allowed]
          if unexpected:
              raise SystemExit('Pruebas omitidas inesperadamente: ' + ', '.join(unexpected))
          PY
      - name: Verificar que la imagen Docker se construye
        run: docker build --tag chemistry-academy-backend:ci .

  publish-container:
    name: Publicar imagen de producción en GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This package must first be created privately outside a public-repo
      # GITHUB_TOKEN workflow. Never let this job create it implicitly.
      - name: Comprobar que el paquete existente es privado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility="$(gh api "user/packages/container/${IMAGE_NAME#*/}" --jq .visibility)"
          test "$visibility" = private
      - name: Preparar etiquetas y metadatos de imagen
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main
      - name: Construir y publicar imagen inmutable
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
