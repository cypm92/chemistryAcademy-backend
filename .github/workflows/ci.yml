name: CI backend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Comprobar sintaxis Python
        run: python -m compileall -q app
      - name: Verificar que la imagen Docker se construye
        run: docker build --tag chemistry-academy-backend:ci .
