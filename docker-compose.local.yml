name: beciencia-local

# Entorno exclusivo de desarrollo: no comparte volúmenes, credenciales ni red
# con producción. El frontend ejecuta Vite en Docker con recarga al guardar.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beciencia
      POSTGRES_PASSWORD: beciencia_local
      POSTGRES_DB: beciencia_local
    volumes:
      - beciencia_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beciencia -d beciencia_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: beciencia-local-backend:local
    build:
      context: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg2://beciencia:beciencia_local@db:5432/beciencia_local
      SECRET_KEY: ${LOCAL_SECRET_KEY:?Copia .env.local.example a .env.local y define LOCAL_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ADMIN_NAME: ${LOCAL_ADMIN_NAME:-Administradora local}
      ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@beciencia.local}
      ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Copia .env.local.example a .env.local y define LOCAL_ADMIN_PASSWORD}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost:${LOCAL_FRONTEND_PORT:-5174},http://127.0.0.1:${LOCAL_FRONTEND_PORT:-5174}
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests:ro
      - beciencia_local_files:/app/storage
    ports:
      - "${LOCAL_BACKEND_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

  notification-worker:
    image: beciencia-local-backend:local
    pull_policy: never
    command: ["python", "-m", "app.notification_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://beciencia:beciencia_local@db:5432/beciencia_local
      SMTP_MODE: log
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
    working_dir: /app
    command: ["sh", "-c", "corepack enable && corepack pnpm@10.17.0 install --frozen-lockfile && corepack pnpm@10.17.0 dev --host 0.0.0.0"]
    environment:
      VITE_DEV_PORT: 5174
      VITE_DEV_API_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - ../frontend:/app
      - beciencia_local_frontend_node_modules:/app/node_modules
    ports:
      - "${LOCAL_FRONTEND_PORT:-5174}:5174"
    depends_on:
      - backend

volumes:
  beciencia_local_db:
  beciencia_local_files:
  beciencia_local_frontend_node_modules:
