name: beciencia-local

# Entorno exclusivo de desarrollo: no comparte volúmenes, credenciales ni red
# con producción. Las aplicaciones se sirven desde imágenes compiladas.
services:
  db:
    image: postgres:16-alpine
    networks: [isolated]
    environment:
      POSTGRES_USER: beciencia
      POSTGRES_PASSWORD: beciencia_local
      POSTGRES_DB: beciencia_local
    volumes:
      - beciencia_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beciencia -d beciencia_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: beciencia-local-backend:local
    build:
      context: .

    environment:
      DATABASE_URL: postgresql+psycopg2://beciencia:beciencia_local@db:5432/beciencia_local
      SECRET_KEY: ${LOCAL_SECRET_KEY:?Copia .env.local.example a .env.local y define LOCAL_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ADMIN_NAME: ${LOCAL_ADMIN_NAME:-Administradora local}
      ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@beciencia.local}
      ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Copia .env.local.example a .env.local y define LOCAL_ADMIN_PASSWORD}
      STORAGE_DIR: /app/storage
      SMTP_MODE: log
      # All newly generated local admin notifications target synthetic mail only.
      NOTIFICATION_ADMIN_RECIPIENTS: preview@example.com
      MICROSOFT_TENANT_ID: 00000000-0000-4000-8000-000000000002
      MICROSOFT_CLIENT_ID: 00000000-0000-4000-8000-000000000003
      MICROSOFT_CLIENT_SECRET: sandbox-fake-client-secret
      MICROSOFT_FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MICROSOFT_REDIRECT_URI: http://127.0.0.1:5174/api/integrations/microsoft/callback
      MICROSOFT_SYNC_ENABLED: 'true'
      PYTHONPATH: /sandbox:/app
      SANDBOX_INJECT: '1'
      CORS_ORIGINS: http://localhost:${LOCAL_FRONTEND_PORT:-5174},http://127.0.0.1:${LOCAL_FRONTEND_PORT:-5174}
    volumes:
      - ./local-microsoft-sandbox:/sandbox:ro
      - beciencia_local_files:/app/storage
    networks: [isolated]
    depends_on:
      db:
        condition: service_healthy

  notification-worker:
    image: beciencia-local-backend:local
    pull_policy: never
    command: ["python", "-m", "app.notification_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://beciencia:beciencia_local@db:5432/beciencia_local
      SMTP_MODE: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SENDER: preview@example.invalid
      SMTP_USERNAME: ''
      SMTP_PASSWORD: ''
      SMTP_SSL: 'false'
      SMTP_STARTTLS: 'false'
      MICROSOFT_TENANT_ID: 00000000-0000-4000-8000-000000000002
      MICROSOFT_CLIENT_ID: 00000000-0000-4000-8000-000000000003
      MICROSOFT_CLIENT_SECRET: sandbox-fake-client-secret
      MICROSOFT_FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MICROSOFT_REDIRECT_URI: http://127.0.0.1:5174/api/integrations/microsoft/callback
      MICROSOFT_SYNC_ENABLED: 'true'
      PYTHONPATH: /sandbox:/app
      SANDBOX_INJECT: '1'
    volumes:
      - ./local-microsoft-sandbox:/sandbox:ro
    networks: [isolated]
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: beciencia-local-frontend:local
    build:
      context: ../frontend
      args:
        VITE_LOCAL_SANDBOX_BUILD: 'true'
        VITE_MICROSOFT_SIMULATED: 'true'
    networks: [isolated]
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:v1.28.2
    networks: [isolated]

  mailpit-ui:
    image: nginx:1.27-alpine
    volumes:
      - ./mail-preview-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8025:8025'
    depends_on: [mailpit]
    networks: [isolated, ingress]

  fake-microsoft:
    image: beciencia-local-backend:local
    pull_policy: never
    working_dir: /sandbox
    command: [python, -m, uvicorn, 'server:app', --host, 0.0.0.0, --port, '8080']
    volumes:
      - ./local-microsoft-sandbox:/sandbox:ro
    networks: [isolated]

  gateway:
    image: node:22-alpine
    command: [node, /sandbox/proxy.js]
    environment:
      SANDBOX_PUBLIC_PORT: '5174'
      SANDBOX_FRONTEND_PORT: '80'
    volumes:
      - ./local-microsoft-sandbox:/sandbox:ro
    ports:
      - '127.0.0.1:5174:8080'
    depends_on: [frontend, fake-microsoft]
    networks: [isolated, ingress]

networks:
  isolated:
    internal: true
  ingress:

volumes:
  beciencia_local_db:
  beciencia_local_files:
  beciencia_local_frontend_node_modules:
